source:
  name: mercari/engineer-vocabulary-list
  url: https://github.com/mercari/engineer-vocabulary-list
  license: CC BY 4.0
  adapted: true
  notes: |
    Vocabulary items are copied from Mercari's Engineer Vocabulary List (CC BY 4.0). Example sentences are based on that list and expanded so each item has 2-3 examples with different sentence structures.
quizzes:
  - id: take-a-ticket-1
    vocab_id: take-a-ticket
    prompt_ja: すでに3つチケットを取っているので、今週は取れません。
    blanked_en: I can't ____ this week because I have already taken 3.
    answers:
      - take a ticket
    hint: take a ticket
  - id: take-a-ticket-2
    vocab_id: take-a-ticket
    prompt_ja: キャパシティがあれば、このチケットを取ってもらえますか。
    blanked_en: Can you ____ if you have capacity?
    answers:
      - take this ticket
    hint: take a ticket
  - id: take-a-ticket-3
    vocab_id: take-a-ticket
    prompt_ja: 決済APIのバグは、私がチケットを取ります。
    blanked_en: I'll ____ for the payment API bug.
    answers:
      - take a ticket
    hint: take a ticket
  - id: already-1
    vocab_id: already
    prompt_ja: すでに3つチケットを取っているので、今週は取れません。
    blanked_en: I can't take a ticket this week because I have ____ taken 3.
    answers:
      - already
    hint: already
  - id: already-2
    vocab_id: already
    prompt_ja: その修正は、すでにステージングにデプロイ済みです。
    blanked_en: The fix has ____ been deployed to staging.
    answers:
      - already
    hint: already
  - id: already-3
    vocab_id: already
    prompt_ja: この件、前回のスタンドアップですでに話しましたか。
    blanked_en: Have we ____ discussed this in the last standup?
    answers:
      - already
    hint: already
  - id: create-a-pull-request-1
    vocab_id: create-a-pull-request
    prompt_ja: 昨日、プルリクを出しました。
    blanked_en: I ____ yesterday.
    answers:
      - made a pull request
    hint: make/create a pull request
  - id: create-a-pull-request-2
    vocab_id: create-a-pull-request
    prompt_ja: テストが通ったら、プルリクを出してもらえますか。
    blanked_en: Could you ____ once the tests pass?
    answers:
      - create a pull request
    hint: make/create a pull request
  - id: create-a-pull-request-3
    vocab_id: create-a-pull-request
    prompt_ja: レビューコメントを直したら、プルリクを出します。
    blanked_en: I'll ____ after I address the review comments.
    answers:
      - make a pull request
    hint: make/create a pull request
  - id: develop-1
    vocab_id: develop
    prompt_ja: 今、通知サービスを開発しています。
    blanked_en: I'm ____ the notification service now.
    answers:
      - developing
    hint: develop
  - id: develop-2
    vocab_id: develop
    prompt_ja: この機能は、先四半期に開発しました。
    blanked_en: We ____ this feature last quarter.
    answers:
      - developed
    hint: develop
  - id: develop-3
    vocab_id: develop
    prompt_ja: 検索まわりは、どのチームが開発していますか。
    blanked_en: Which team is ____ the search flow?
    answers:
      - developing
    hint: develop
  - id: revise-1
    vocab_id: revise
    prompt_ja: 修正は今日中に終わると思います。
    blanked_en: I think I'll ____ it by the end of today.
    answers:
      - revise
    hint: correct, revise
  - id: revise-2
    vocab_id: revise
    prompt_ja: READMEの誤字を修正してもらえますか。
    blanked_en: Could you ____ the typo in the README?
    answers:
      - correct
    hint: correct, revise
  - id: revise-3
    vocab_id: revise
    prompt_ja: デザインレビューのあと、仕様が修正されました。
    blanked_en: The spec was ____ after the design review.
    answers:
      - revised
    hint: correct, revise
  - id: merge-1
    vocab_id: merge
    prompt_ja: featureブランチをmainにマージしました。
    blanked_en: I ____ the feature branch into main.
    answers:
      - merged
    hint: merge
  - id: merge-2
    vocab_id: merge
    prompt_ja: QAがOKを出すまで、マージしないでください。
    blanked_en: Don't ____ this until QA signs off.
    answers:
      - merge
    hint: merge
  - id: merge-3
    vocab_id: merge
    prompt_ja: CIが通ったら、そのプルリクをマージできます。
    blanked_en: Once CI is green, we can ____ the pull request.
    answers:
      - merge
    hint: merge
  - id: proceed-1
    vocab_id: proceed
    prompt_ja: このチケットは、Kenさんと一緒に進めています。
    blanked_en: I'm ____ this ticket with Ken.
    answers:
      - working on
    hint: move forward, proceed with, work on
  - id: proceed-2
    vocab_id: proceed
    prompt_ja: 当初の計画で進めましょう。
    blanked_en: Let's ____ the original plan.
    answers:
      - proceed with
    hint: move forward, proceed with, work on
  - id: proceed-3
    vocab_id: proceed
    prompt_ja: 次のスプリントの前に、この件を進めた方がいいです。
    blanked_en: We should ____ before the next sprint.
    answers:
      - move this forward
    hint: move forward, proceed with, work on
  - id: work-operate-1
    vocab_id: work-operate
    prompt_ja: システムがちゃんと動いてないことがわかった。
    blanked_en: I realized that the system was not ____ properly.
    answers:
      - working
    hint: work, operate
  - id: work-operate-2
    vocab_id: work-operate
    prompt_ja: バッチジョブは、毎晩0時に動きます。
    blanked_en: The batch job ____ every night at midnight.
    answers:
      - operates
    hint: work, operate
  - id: work-operate-3
    vocab_id: work-operate
    prompt_ja: ステージング環境は、今動いていますか。
    blanked_en: Is the staging environment ____ now?
    answers:
      - working
    hint: work, operate
  - id: properly-1
    vocab_id: properly
    prompt_ja: システムがちゃんと動いてないことがわかった。
    blanked_en: I realized that the system was not working ____.
    answers:
      - properly
    hint: properly
  - id: properly-2
    vocab_id: properly
    prompt_ja: エラーハンドリングは、ちゃんと実装してください。
    blanked_en: Please make sure the error handling is implemented ____.
    answers:
      - properly
    hint: properly
  - id: properly-3
    vocab_id: properly
    prompt_ja: ログがちゃんと収集されていません。
    blanked_en: The logs aren't being collected ____.
    answers:
      - properly
    hint: properly
  - id: make-a-deadline-1
    vocab_id: make-a-deadline
    prompt_ja: 来週のリリースには間に合いそうです。
    blanked_en: It seems that we'll ____ next week.
    answers:
      - make the release
    hint: be in time, make a deadline
  - id: make-a-deadline-2
    vocab_id: make-a-deadline
    prompt_ja: スコープを増やすと、締切に間に合わないと思います。
    blanked_en: I don't think we can ____ if we add more scope.
    answers:
      - make the deadline
    hint: be in time, make a deadline
  - id: make-a-deadline-3
    vocab_id: make-a-deadline
    prompt_ja: ドキュメントは、ローンチに間に合いますか。
    blanked_en: Will the documentation be ____ for the launch?
    answers:
      - in time
    hint: be in time, make a deadline
  - id: status-1
    vocab_id: status
    prompt_ja: QAしてもらえる状態のものがありますか。
    blanked_en: Is there anything in a ____ ready for QA?
    answers:
      - state
    hint: status
  - id: status-2
    vocab_id: status
    prompt_ja: マイグレーションの今の状態を教えてください。
    blanked_en: What's the current ____ of the migration?
    answers:
      - status
    hint: status
  - id: status-3
    vocab_id: status
    prompt_ja: 障害のあと、サービスは劣化状態です。
    blanked_en: The service is in a degraded ____ after the incident.
    answers:
      - status
    hint: status
  - id: issue-1
    vocab_id: issue
    prompt_ja: 課題が見つかった。
    blanked_en: We found some ____.
    answers:
      - issues
    hint: issue
  - id: issue-2
    vocab_id: issue
    prompt_ja: この課題は、次のレトロで議論した方がいいです。
    blanked_en: This ____ should be discussed in the next retro.
    answers:
      - issue
    hint: issue
  - id: issue-3
    vocab_id: issue
    prompt_ja: リリースを止めている未解決の課題はありますか。
    blanked_en: Are there any open ____ blocking the release?
    answers:
      - issues
    hint: issue
  - id: requirements-1
    vocab_id: requirements
    prompt_ja: 要件は明日、テックリードに共有します。
    blanked_en: I'll share the ____ with the tech leads tomorrow.
    answers:
      - requirements
    hint: requirements
  - id: requirements-2
    vocab_id: requirements
    prompt_ja: 要件がまだはっきりしていません。
    blanked_en: The ____ are still unclear.
    answers:
      - requirements
    hint: requirements
  - id: requirements-3
    vocab_id: requirements
    prompt_ja: 実装を始める前に、要件を固めた方がいいです。
    blanked_en: We should freeze the ____ before implementation starts.
    answers:
      - requirements
    hint: requirements
  - id: specification-1
    vocab_id: specification
    prompt_ja: まだ仕様が決まってない。
    blanked_en: The ____ haven't been decided yet.
    answers:
      - specs
    hint: specification
  - id: specification-2
    vocab_id: specification
    prompt_ja: APIの変更を仕様に反映してください。
    blanked_en: Please update the ____ to reflect the API change.
    answers:
      - spec
    hint: specification
  - id: specification-3
    vocab_id: specification
    prompt_ja: 仕様では、このエンドポイントは404を返すことになっています。
    blanked_en: According to the ____, this endpoint should return 404.
    answers:
      - specification
    hint: specification
  - id: take-shape-1
    vocab_id: take-shape
    prompt_ja: まだ仕様が固まっていません。
    blanked_en: The specs haven't ____ yet.
    answers:
      - taken shape
    hint: take shape
  - id: take-shape-2
    vocab_id: take-shape
    prompt_ja: 設計が固まったら、見積もり精度が上がります。
    blanked_en: Once the design ____, we can estimate more accurately.
    answers:
      - takes shape
    hint: take shape
  - id: take-shape-3
    vocab_id: take-shape
    prompt_ja: ロールアウト計画が、ようやく固まってきました。
    blanked_en: The rollout plan is starting to ____.
    answers:
      - take shape
    hint: take shape
  - id: obstacle-1
    vocab_id: obstacle
    prompt_ja: それによってプロジェクトに支障が出ています。
    blanked_en: That is causing an ____ for our project.
    answers:
      - obstacle
    hint: obstacle, hitch
  - id: obstacle-2
    vocab_id: obstacle
    prompt_ja: VPNの不調が、日常業務の支障になっています。
    blanked_en: The VPN issues are a ____ in our daily work.
    answers:
      - hitch
    hint: obstacle, hitch
  - id: obstacle-3
    vocab_id: obstacle
    prompt_ja: ローンチに支障が出る前に、これを解消する必要があります。
    blanked_en: We need to resolve this before it ____ the launch.
    answers:
      - interferes with
    hint: obstacle, hitch
  - id: effect-1
    vocab_id: effect
    prompt_ja: これは、お客様に影響があるインシデントじゃないです。
    blanked_en: This is not an incident that has an ____ on customers.
    answers:
      - effect
    hint: effect, impact
  - id: effect-2
    vocab_id: effect
    prompt_ja: この変更がチェックアウトに与える影響は何ですか。
    blanked_en: What is the ____ of this change on the checkout flow?
    answers:
      - impact
    hint: effect, impact
  - id: effect-3
    vocab_id: effect
    prompt_ja: ロールアウト前に、レイテンシへの影響を確認した方がいいです。
    blanked_en: We should assess the ____ on latency before rolling out.
    answers:
      - effect
    hint: effect, impact
  - id: cause-1
    vocab_id: cause
    prompt_ja: これから原因を調べます。
    blanked_en: I will look into the ____ now.
    answers:
      - causes
    hint: cause
  - id: cause-2
    vocab_id: cause
    prompt_ja: 根本原因は、タイムアウトの設定ミスでした。
    blanked_en: The root ____ was a misconfigured timeout.
    answers:
      - cause
    hint: cause
  - id: cause-3
    vocab_id: cause
    prompt_ja: メモリリークの原因は特定できましたか。
    blanked_en: Have we identified the ____ of the memory leak?
    answers:
      - cause
    hint: cause
  - id: consult-1
    vocab_id: consult
    prompt_ja: マネージャーに相談する。
    blanked_en: I'll ____ my manager.
    answers:
      - consult with
    hint: consult
  - id: consult-2
    vocab_id: consult
    prompt_ja: DBスキーマの件、相談してもいいですか。
    blanked_en: Can I ____ you about the database schema?
    answers:
      - consult
    hint: consult
  - id: consult-3
    vocab_id: consult
    prompt_ja: その機能を有効にする前に、セキュリティチームに相談しました。
    blanked_en: She ____ the security team before enabling the feature.
    answers:
      - consulted
    hint: consult
  - id: be-in-trouble-1
    vocab_id: be-in-trouble
    prompt_ja: 何か困ってることがありますか。
    blanked_en: Do you have any ____?
    answers:
      - difficulties
    hint: be in trouble, have difficulties
  - id: be-in-trouble-2
    vocab_id: be-in-trouble
    prompt_ja: そのバグの再現で困っています。
    blanked_en: I'm ____ reproducing the bug.
    answers:
      - having trouble
    hint: be in trouble, have difficulties
  - id: be-in-trouble-3
    vocab_id: be-in-trouble
    prompt_ja: デプロイで困ったら、連絡してください。
    blanked_en: Let me know if you're ____ with the deployment.
    answers:
      - in trouble
    hint: be in trouble, have difficulties
  - id: align-with-1
    vocab_id: align-with
    prompt_ja: これはteam Bと連携してやっていきます。
    blanked_en: We are ____ team B to do this.
    answers:
      - aligned with
    hint: work together, align with
  - id: align-with-2
    vocab_id: align-with
    prompt_ja: この件は、SREチームと連携する必要があります。
    blanked_en: We need to ____ the SRE team on this.
    answers:
      - work together with
    hint: work together, align with
  - id: align-with-3
    vocab_id: align-with
    prompt_ja: スコープを変える前に、PdMと連携してください。
    blanked_en: Please ____ the product manager before changing the scope.
    answers:
      - align with
    hint: work together, align with
  - id: sync-1
    vocab_id: sync
    prompt_ja: あとでテックリードとsyncしておきます。
    blanked_en: I will ____ the tech lead later.
    answers:
      - sync with
    hint: sync
  - id: sync-2
    vocab_id: sync
    prompt_ja: 障害の件、明日の朝にsyncしましょう。
    blanked_en: Let's ____ tomorrow morning about the incident.
    answers:
      - sync
    hint: sync
  - id: sync-3
    vocab_id: sync
    prompt_ja: PRを出す前に、mainから最新をsyncします。
    blanked_en: I'll ____ the latest changes from main before opening the PR.
    answers:
      - sync
    hint: sync
  - id: set-1
    vocab_id: set
    prompt_ja: 目標を設定する。
    blanked_en: I'll ____ goals.
    answers:
      - set
    hint: set
  - id: set-2
    vocab_id: set
    prompt_ja: タイムアウトは30秒に設定してください。
    blanked_en: Please ____ the timeout to 30 seconds.
    answers:
      - set
    hint: set
  - id: set-3
    vocab_id: set
    prompt_ja: ローンチ日は、まだ設定していません。
    blanked_en: We haven't ____ a date for the launch yet.
    answers:
      - set
    hint: set
  - id: reflect-1
    vocab_id: reflect
    prompt_ja: 先週修正したけど、Jiraに反映されてません。
    blanked_en: I edited it last week, but it isn't ____ on Jira yet.
    answers:
      - reflected
    hint: reflect
  - id: reflect-2
    vocab_id: reflect
    prompt_ja: 設定変更は、次のデプロイ後に反映されます。
    blanked_en: The config change will be ____ after the next deploy.
    answers:
      - reflected
    hint: reflect
  - id: reflect-3
    vocab_id: reflect
    prompt_ja: 新しい文言が本番に反映されているか確認してください。
    blanked_en: Please make sure the new copy is ____ on the production site.
    answers:
      - reflected
    hint: reflect
  - id: efficiency-1
    vocab_id: efficiency
    prompt_ja: そのやり方は、効率がよさそう。
    blanked_en: That method seems ____.
    answers:
      - efficient
    hint: efficiency
  - id: efficiency-2
    vocab_id: efficiency
    prompt_ja: CIパイプラインの効率を上げた方がいいです。
    blanked_en: We should improve the ____ of the CI pipeline.
    answers:
      - efficiency
    hint: efficiency
  - id: efficiency-3
    vocab_id: efficiency
    prompt_ja: クエリ結果をキャッシュした方が、効率的です。
    blanked_en: Caching the query results would be more ____.
    answers:
      - efficient
    hint: efficiency
  - id: details-1
    vocab_id: details
    prompt_ja: 詳細はdocsを見てください。
    blanked_en: Please check the docs for ____.
    answers:
      - details
    hint: details
  - id: details-2
    vocab_id: details
    prompt_ja: 障害の詳細を、後ほど共有します。
    blanked_en: I'll share the ____ of the incident later.
    answers:
      - details
    hint: details
  - id: details-3
    vocab_id: details
    prompt_ja: 詳細がわからないので、設計を進められません。
    blanked_en: We can't proceed with the design because the ____ are unclear.
    answers:
      - details
    hint: details
  - id: in-detail-1
    vocab_id: in-detail
    prompt_ja: どんなインシデントだったか詳しく教えてもらえますか。
    blanked_en: Could you tell me about the incident ____?
    answers:
      - in detail
    hint: in detail
  - id: in-detail-2
    vocab_id: in-detail
    prompt_ja: ログを詳しく見てみます。
    blanked_en: I'll look at the logs ____.
    answers:
      - in detail
    hint: in detail
  - id: in-detail-3
    vocab_id: in-detail
    prompt_ja: 設計ドキュメントで、ロールアウト手順が詳しく書いてあります。
    blanked_en: The rollout steps are described ____ in the design doc.
    answers:
      - in detail
    hint: in detail
  - id: policy-1
    vocab_id: policy
    prompt_ja: まだ会社の方針が決まってない。
    blanked_en: The company ____ has not been decided yet.
    answers:
      - policy
    hint: policy
  - id: policy-2
    vocab_id: policy
    prompt_ja: この変更は、セキュリティ方針に合っていますか。
    blanked_en: Does this change comply with the security ____?
    answers:
      - policy
    hint: policy
  - id: policy-3
    vocab_id: policy
    prompt_ja: オンコールの方針を、チームで見直しましょう。
    blanked_en: Let's review the on-call ____ as a team.
    answers:
      - policy
    hint: policy
  - id: supplementary-1
    vocab_id: supplementary
    prompt_ja: ケンさんの話への補足なんですけど。
    blanked_en: Let me add something ____ to what Ken said.
    answers:
      - supplementary
    hint: supplementary, additional
  - id: supplementary-2
    vocab_id: supplementary
    prompt_ja: 補足ですが、このAPIはまだベータです。
    blanked_en: As an ____ note, this API is still in beta.
    answers:
      - additional
    hint: supplementary, additional
  - id: supplementary-3
    vocab_id: supplementary
    prompt_ja: READMEに、セットアップ手順の補足を書きました。
    blanked_en: I added a ____ note on the setup steps to the README.
    answers:
      - supplementary
    hint: supplementary, additional
  - id: effective-1
    vocab_id: effective
    prompt_ja: このやり方が効果的だと思います。
    blanked_en: I think this way is ____.
    answers:
      - effective
    hint: effective
  - id: effective-2
    vocab_id: effective
    prompt_ja: キャッシュは、このレイテンシ問題に効果的ですか。
    blanked_en: Would caching be ____ for this latency issue?
    answers:
      - effective
    hint: effective
  - id: effective-3
    vocab_id: effective
    prompt_ja: アラートを減らすには、しきい値の見直しが一番効果的でした。
    blanked_en: Revising the thresholds was the most ____ way to reduce alerts.
    answers:
      - effective
    hint: effective
  - id: achieve-1
    vocab_id: achieve
    prompt_ja: 先週、OKRを達成しました。
    blanked_en: We ____ our OKR last week.
    answers:
      - achieved
    hint: achieve
  - id: achieve-2
    vocab_id: achieve
    prompt_ja: このペースなら、今四半期の目標を達成できそうです。
    blanked_en: At this pace, we should be able to ____ this quarter's goals.
    answers:
      - achieve
    hint: achieve
  - id: achieve-3
    vocab_id: achieve
    prompt_ja: 99.9%の可用性は、まだ達成できていません。
    blanked_en: We haven't ____ 99.9% availability yet.
    answers:
      - achieved
    hint: achieve
  - id: report-1
    vocab_id: report
    prompt_ja: プロジェクトについて報告します。
    blanked_en: I will ____ the project.
    answers:
      - report on
    hint: report
  - id: report-2
