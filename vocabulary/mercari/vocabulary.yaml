source:
  name: mercari/engineer-vocabulary-list
  url: https://github.com/mercari/engineer-vocabulary-list
  license: CC BY 4.0
  adapted: true
  notes: >
    Vocabulary items are copied from Mercari's Engineer Vocabulary List
    (CC BY 4.0). Example sentences are based on that list and expanded
    so each item has 2-3 examples with different sentence structures.

entries:
  - id: take-a-ticket
    ja: チケットを取る
    ja_reading: チケットをとる
    en: take a ticket
    pos: phrase
    lists: [1]
    examples:
      - ja: すでに3つチケットを取っているので、今週は取れません。
        en: I can't take a ticket this week because I have already taken 3.
        blank: take a ticket
      - ja: キャパシティがあれば、このチケットを取ってもらえますか。
        en: Can you take this ticket if you have capacity?
        blank: take this ticket
      - ja: 決済APIのバグは、私がチケットを取ります。
        en: I'll take a ticket for the payment API bug.
        blank: take a ticket

  - id: already
    ja: すでに
    ja_reading: すでに
    en: already
    pos: adverb
    lists: [1]
    notes: 元リストでは例文欄が「ー」。他の例文中の語として独立させた。
    examples:
      - ja: すでに3つチケットを取っているので、今週は取れません。
        en: I can't take a ticket this week because I have already taken 3.
        blank: already
      - ja: その修正は、すでにステージングにデプロイ済みです。
        en: The fix has already been deployed to staging.
        blank: already
      - ja: この件、前回のスタンドアップですでに話しましたか。
        en: Have we already discussed this in the last standup?
        blank: already

  - id: create-a-pull-request
    ja: プルリクを出す
    ja_reading: プルリクをだす
    en: make/create a pull request
    pos: phrase
    lists: [1]
    examples:
      - ja: 昨日、プルリクを出しました。
        en: I made a pull request yesterday.
        blank: made a pull request
      - ja: テストが通ったら、プルリクを出してもらえますか。
        en: Could you create a pull request once the tests pass?
        blank: create a pull request
      - ja: レビューコメントを直したら、プルリクを出します。
        en: I'll make a pull request after I address the review comments.
        blank: make a pull request

  - id: develop
    ja: 開発する
    ja_reading: かいはつする
    en: develop
    pos: verb
    lists: [1]
    examples:
      - ja: 今、通知サービスを開発しています。
        en: I'm developing the notification service now.
        blank: developing
      - ja: この機能は、先四半期に開発しました。
        en: We developed this feature last quarter.
        blank: developed
      - ja: 検索まわりは、どのチームが開発していますか。
        en: Which team is developing the search flow?
        blank: developing

  - id: revise
    ja: 修正する
    ja_reading: しゅうせいする
    en: correct, revise
    pos: verb
    lists: [1]
    examples:
      - ja: 修正は今日中に終わると思います。
        en: I think I'll revise it by the end of today.
        blank: revise
      - ja: READMEの誤字を修正してもらえますか。
        en: Could you correct the typo in the README?
        blank: correct
      - ja: デザインレビューのあと、仕様が修正されました。
        en: The spec was revised after the design review.
        blank: revised

  - id: merge
    ja: マージする
    ja_reading: マージする
    en: merge
    pos: verb
    lists: [1]
    examples:
      - ja: featureブランチをmainにマージしました。
        en: I merged the feature branch into main.
        blank: merged
      - ja: QAがOKを出すまで、マージしないでください。
        en: Don't merge this until QA signs off.
        blank: merge
      - ja: CIが通ったら、そのプルリクをマージできます。
        en: Once CI is green, we can merge the pull request.
        blank: merge

  - id: proceed
    ja: 進める
    ja_reading: すすめる
    en: move forward, proceed with, work on
    pos: verb
    notes: 他動詞。作業を進める / 計画を前に進める、の両方で使う。
    lists: [1]
    examples:
      - ja: このチケットは、Kenさんと一緒に進めています。
        en: I'm working on this ticket with Ken.
        blank: working on
      - ja: 当初の計画で進めましょう。
        en: Let's proceed with the original plan.
        blank: proceed with
      - ja: 次のスプリントの前に、この件を進めた方がいいです。
        en: We should move this forward before the next sprint.
        blank: move this forward

  - id: work-operate
    ja: 動く
    ja_reading: うごく
    en: work, operate
    pos: verb
    notes: 主にシステムやジョブが動作している、という文脈。
    lists: [1]
    examples:
      - ja: システムがちゃんと動いてないことがわかった。
        en: I realized that the system was not working properly.
        blank: working
      - ja: バッチジョブは、毎晩0時に動きます。
        en: The batch job operates every night at midnight.
        blank: operates
      - ja: ステージング環境は、今動いていますか。
        en: Is the staging environment working now?
        blank: working

  - id: properly
    ja: ちゃんと
    ja_reading: ちゃんと
    en: properly
    pos: adverb
    notes: カジュアル。元リストでは例文欄が「ー」。
    lists: [1]
    examples:
      - ja: システムがちゃんと動いてないことがわかった。
        en: I realized that the system was not working properly.
        blank: properly
      - ja: エラーハンドリングは、ちゃんと実装してください。
        en: Please make sure the error handling is implemented properly.
        blank: properly
      - ja: ログがちゃんと収集されていません。
        en: The logs aren't being collected properly.
        blank: properly

  - id: make-a-deadline
    ja: 間に合う
    ja_reading: まにあう
    en: be in time, make a deadline
    pos: verb
    lists: [1]
    examples:
      - ja: 来週のリリースには間に合いそうです。
        en: It seems that we'll make the release next week.
        blank: make the release
      - ja: スコープを増やすと、締切に間に合わないと思います。
        en: I don't think we can make the deadline if we add more scope.
        blank: make the deadline
      - ja: ドキュメントは、ローンチに間に合いますか。
        en: Will the documentation be in time for the launch?
        blank: in time

  - id: status
    ja: 状態
    ja_reading: じょうたい
    en: status
    pos: noun
    lists: [1]
    examples:
      - ja: QAしてもらえる状態のものがありますか。
        en: Is there anything in a state ready for QA?
        blank: state
      - ja: マイグレーションの今の状態を教えてください。
        en: What's the current status of the migration?
        blank: status
      - ja: 障害のあと、サービスは劣化状態です。
        en: The service is in a degraded status after the incident.
        blank: status

  - id: issue
    ja: 課題
    ja_reading: かだい
    en: issue
    pos: noun
    lists: [1]
    examples:
      - ja: 課題が見つかった。
        en: We found some issues.
        blank: issues
      - ja: この課題は、次のレトロで議論した方がいいです。
        en: This issue should be discussed in the next retro.
        blank: issue
      - ja: リリースを止めている未解決の課題はありますか。
        en: Are there any open issues blocking the release?
        blank: issues

  - id: requirements
    ja: 要件
    ja_reading: ようけん
    en: requirements
    pos: noun
    lists: [1]
    examples:
      - ja: 要件は明日、テックリードに共有します。
        en: I'll share the requirements with the tech leads tomorrow.
        blank: requirements
      - ja: 要件がまだはっきりしていません。
        en: The requirements are still unclear.
        blank: requirements
      - ja: 実装を始める前に、要件を固めた方がいいです。
        en: We should freeze the requirements before implementation starts.
        blank: requirements

  - id: specification
    ja: 仕様
    ja_reading: しよう
    en: specification
    pos: noun
    lists: [1]
    examples:
      - ja: まだ仕様が決まってない。
        en: The specs haven't been decided yet.
        blank: specs
      - ja: APIの変更を仕様に反映してください。
        en: Please update the spec to reflect the API change.
        blank: spec
      - ja: 仕様では、このエンドポイントは404を返すことになっています。
        en: According to the specification, this endpoint should return 404.
        blank: specification

  - id: take-shape
    ja: 固まる
    ja_reading: かたまる
    en: take shape
    pos: verb
    notes: 自動詞。仕様や方針が固まる、という使い方。
    lists: [1]
    examples:
      - ja: まだ仕様が固まっていません。
        en: The specs haven't taken shape yet.
        blank: taken shape
      - ja: 設計が固まったら、見積もり精度が上がります。
        en: Once the design takes shape, we can estimate more accurately.
        blank: takes shape
      - ja: ロールアウト計画が、ようやく固まってきました。
        en: The rollout plan is starting to take shape.
        blank: take shape

  - id: obstacle
    ja: 支障
    ja_reading: ししょう
    en: obstacle, hitch
    pos: noun
    lists: [1]
    examples:
      - ja: それによってプロジェクトに支障が出ています。
        en: That is causing an obstacle for our project.
        blank: obstacle
      - ja: VPNの不調が、日常業務の支障になっています。
        en: The VPN issues are a hitch in our daily work.
        blank: hitch
      - ja: ローンチに支障が出る前に、これを解消する必要があります。
        en: We need to resolve this before it interferes with the launch.
        blank: interferes with

  - id: effect
    ja: 影響
    ja_reading: えいきょう
    en: effect, impact
    pos: noun
    lists: [1]
    examples:
      - ja: これは、お客様に影響があるインシデントじゃないです。
        en: This is not an incident that has an effect on customers.
        blank: effect
      - ja: この変更がチェックアウトに与える影響は何ですか。
        en: What is the impact of this change on the checkout flow?
        blank: impact
      - ja: ロールアウト前に、レイテンシへの影響を確認した方がいいです。
        en: We should assess the effect on latency before rolling out.
        blank: effect

  - id: cause
    ja: 原因
    ja_reading: げんいん
    en: cause
    pos: noun
    lists: [1]
    examples:
      - ja: これから原因を調べます。
        en: I will look into the causes now.
        blank: causes
      - ja: 根本原因は、タイムアウトの設定ミスでした。
        en: The root cause was a misconfigured timeout.
        blank: cause
      - ja: メモリリークの原因は特定できましたか。
        en: Have we identified the cause of the memory leak?
        blank: cause

  - id: consult
    ja: 相談する
    ja_reading: そうだんする
    en: consult
    pos: verb
    lists: [1]
    examples:
      - ja: マネージャーに相談する。
        en: I'll consult with my manager.
        blank: consult with
      - ja: DBスキーマの件、相談してもいいですか。
        en: Can I consult you about the database schema?
        blank: consult
      - ja: その機能を有効にする前に、セキュリティチームに相談しました。
        en: She consulted the security team before enabling the feature.
        blank: consulted

  - id: be-in-trouble
    ja: 困る
    ja_reading: こまる
    en: be in trouble, have difficulties
    pos: verb
    lists: [1]
    examples:
      - ja: 何か困ってることがありますか。
        en: Do you have any difficulties?
        blank: difficulties
      - ja: そのバグの再現で困っています。
        en: I'm having trouble reproducing the bug.
        blank: having trouble
      - ja: デプロイで困ったら、連絡してください。
        en: Let me know if you're in trouble with the deployment.
        blank: in trouble

  - id: align-with
    ja: 連携する
    ja_reading: れんけいする
    en: work together, align with
    pos: verb
    lists: [1]
    examples:
      - ja: これはteam Bと連携してやっていきます。
        en: We are aligned with team B to do this.
        blank: aligned with
      - ja: この件は、SREチームと連携する必要があります。
        en: We need to work together with the SRE team on this.
        blank: work together with
      - ja: スコープを変える前に、PdMと連携してください。
        en: Please align with the product manager before changing the scope.
        blank: align with

  - id: sync
    ja: syncする
    ja_reading: シンクする
    en: sync
    pos: verb
    notes: 人と認識を合わせる意味と、ブランチやデータを同期する意味の両方。
    lists: [1]
    examples:
      - ja: あとでテックリードとsyncしておきます。
        en: I will sync with the tech lead later.
        blank: sync with
      - ja: 障害の件、明日の朝にsyncしましょう。
        en: Let's sync tomorrow morning about the incident.
        blank: sync
      - ja: PRを出す前に、mainから最新をsyncします。
        en: I'll sync the latest changes from main before opening the PR.
        blank: sync

  - id: set
    ja: 設定する
    ja_reading: せっていする
    en: set
    pos: verb
    lists: [1]
    examples:
      - ja: 目標を設定する。
        en: I'll set goals.
        blank: set
      - ja: タイムアウトは30秒に設定してください。
        en: Please set the timeout to 30 seconds.
        blank: set
      - ja: ローンチ日は、まだ設定していません。
        en: We haven't set a date for the launch yet.
        blank: set

  - id: reflect
    ja: 反映する
    ja_reading: はんえいする
    en: reflect
    pos: verb
    lists: [1]
    examples:
      - ja: 先週修正したけど、Jiraに反映されてません。
        en: I edited it last week, but it isn't reflected on Jira yet.
        blank: reflected
      - ja: 設定変更は、次のデプロイ後に反映されます。
        en: The config change will be reflected after the next deploy.
        blank: reflected
      - ja: 新しい文言が本番に反映されているか確認してください。
        en: Please make sure the new copy is reflected on the production site.
        blank: reflected

  - id: efficiency
    ja: 効率
    ja_reading: こうりつ
    en: efficiency
    pos: noun
    lists: [1]
    examples:
      - ja: そのやり方は、効率がよさそう。
        en: That method seems efficient.
        blank: efficient
      - ja: CIパイプラインの効率を上げた方がいいです。
        en: We should improve the efficiency of the CI pipeline.
        blank: efficiency
      - ja: クエリ結果をキャッシュした方が、効率的です。
        en: Caching the query results would be more efficient.
        blank: efficient

  - id: details
    ja: 詳細
    ja_reading: しょうさい
    en: details
    pos: noun
    lists: [2]
    examples:
      - ja: 詳細はdocsを見てください。
        en: Please check the docs for details.
        blank: details
      - ja: 障害の詳細を、後ほど共有します。
        en: I'll share the details of the incident later.
        blank: details
      - ja: 詳細がわからないので、設計を進められません。
        en: We can't proceed with the design because the details are unclear.
        blank: details

  - id: in-detail
    ja: 詳しく
    ja_reading: くわしく
    en: in detail
    pos: adverb
    lists: [2]
    examples:
      - ja: どんなインシデントだったか詳しく教えてもらえますか。
        en: Could you tell me about the incident in detail?
        blank: in detail
      - ja: ログを詳しく見てみます。
        en: I'll look at the logs in detail.
        blank: in detail
      - ja: 設計ドキュメントで、ロールアウト手順が詳しく書いてあります。
        en: The rollout steps are described in detail in the design doc.
        blank: in detail

  - id: policy
    ja: 方針
    ja_reading: ほうしん
    en: policy
    pos: noun
    lists: [2]
    examples:
      - ja: まだ会社の方針が決まってない。
        en: The company policy has not been decided yet.
        blank: policy
      - ja: この変更は、セキュリティ方針に合っていますか。
        en: Does this change comply with the security policy?
        blank: policy
      - ja: オンコールの方針を、チームで見直しましょう。
        en: Let's review the on-call policy as a team.
        blank: policy

  - id: supplementary
    ja: 補足
    ja_reading: ほそく
    en: supplementary, additional
    pos: noun
    lists: [2]
    examples:
      - ja: ケンさんの話への補足なんですけど。
        en: Let me add something supplementary to what Ken said.
        blank: supplementary
      - ja: 補足ですが、このAPIはまだベータです。
        en: As an additional note, this API is still in beta.
        blank: additional
      - ja: READMEに、セットアップ手順の補足を書きました。
        en: I added a supplementary note on the setup steps to the README.
        blank: supplementary

  - id: effective
    ja: 効果的
    ja_reading: こうかてき
    en: effective
    pos: na-adjective
    lists: [2]
    examples:
      - ja: このやり方が効果的だと思います。
        en: I think this way is effective.
        blank: effective
      - ja: キャッシュは、このレイテンシ問題に効果的ですか。
        en: Would caching be effective for this latency issue?
        blank: effective
      - ja: アラートを減らすには、しきい値の見直しが一番効果的でした。
        en: Revising the thresholds was the most effective way to reduce alerts.
        blank: effective

  - id: achieve
    ja: 達成する
    ja_reading: たっせいする
    en: achieve
    pos: verb
    lists: [2]
    examples:
      - ja: 先週、OKRを達成しました。
        en: We achieved our OKR last week.
        blank: achieved
      - ja: このペースなら、今四半期の目標を達成できそうです。
        en: At this pace, we should be able to achieve this quarter's goals.
        blank: achieve
      - ja: 99.9%の可用性は、まだ達成できていません。
        en: We haven't achieved 99.9% availability yet.
        blank: achieved

  - id: report
    ja: 報告する
    ja_reading: ほうこくする
    en: report
    pos: verb
    lists: [2]
    examples:
      - ja: プロジェクトについて報告します。
        en: I will report on the project.
        blank: report on
      - ja: インシデントは、すぐにオンコールに報告してください。
        en: Please report the incident to the on-call engineer right away.
        blank: report
      - ja: 進捗は、週次でマネージャーに報告しています。
        en: Progress is reported to the manager weekly.
        blank: reported

  - id: discuss
    ja: 議論する
    ja_reading: ぎろんする
    en: discuss
    pos: verb
    lists: [2]
    examples:
      - ja: それはEMが議論しているところです。
        en: EMs are discussing it now.
        blank: discussing
      - ja: この設計、次のミーティングで議論しましょう。
        en: Let's discuss this design in the next meeting.
        blank: discuss
      - ja: スコープについては、まだ十分に議論できていません。
        en: We haven't discussed the scope enough yet.
        blank: discussed

  - id: defect
    ja: 不具合
    ja_reading: ふぐあい
    en: defect, bug
    pos: noun
    lists: [2]
    examples:
      - ja: ちょっと不具合があるので、今日中に直します。
        en: There are some defects, so I'll fix them by the end of the day.
        blank: defects
      - ja: 本番で不具合が見つかりました。
        en: We found a bug in production.
        blank: bug
      - ja: この不具合は、決済フローに影響しますか。
        en: Does this defect affect the payment flow?
        blank: defect

  - id: smooth
    ja: 順調
    ja_reading: じゅんちょう
    en: smooth
    pos: noun/na-adjective
    lists: [2]
    examples:
      - ja: これは、順調に進んでいます。
        en: This is going smoothly.
        blank: smoothly
      - ja: マイグレーションは順調ですか。
        en: Is the migration going smoothly?
        blank: smoothly
      - ja: リリースは順調で、ロールバックは不要でした。
        en: The release was smooth, so we didn't need to roll back.
        blank: smooth

  - id: amount
    ja: 量
    ja_reading: りょう
    en: amount
    pos: noun
    lists: [2]
    examples:
      - ja: タスクの量が多すぎます。
        en: The amount of remaining work is too large.
        blank: amount
      - ja: ログの量が増えて、ディスクを圧迫しています。
        en: The amount of logs has grown and is filling up the disk.
        blank: amount
      - ja: レビューの量を、スプリントごとに測っています。
        en: We measure the amount of reviews per sprint.
        blank: amount

  - id: concrete
    ja: 具体的
    ja_reading: ぐたいてき
    en: concrete
    pos: na-adjective
    lists: [2]
    examples:
      - ja: 具体的にどんなインシデントでしたか。
        en: Could you explain the incident more concretely?
        blank: concretely
      - ja: 次のアクションを、もっと具体的にしましょう。
        en: Let's make the next actions more concrete.
        blank: concrete
      - ja: 具体的な例がないと、要件がイメージしにくいです。
        en: It's hard to picture the requirements without a concrete example.
        blank: concrete

  - id: situation
    ja: 状況
    ja_reading: じょうきょう
    en: situation
    pos: noun
    lists: [2]
    examples:
      - ja: QAのリソースが厳しい状況です。
        en: We're in a tough situation in terms of QA resources.
        blank: situation
      - ja: 障害の状況を、チャンネルで共有します。
        en: I'll share the incident situation in the channel.
        blank: situation
      - ja: 今の状況では、スコープを減らした方がいいです。
        en: In the current situation, we should reduce the scope.
        blank: situation

  - id: present-situation
    ja: 現状
    ja_reading: げんじょう
    en: present situation
    pos: noun
    lists: [2]
    examples:
      - ja: 現状を説明します。
        en: I'll explain the present situation.
        blank: present situation
      - ja: 現状では、このAPIは認証なしです。
        en: In the present situation, this API has no authentication.
        blank: present situation
      - ja: 現状を踏まえると、リリースは来週にずらした方がいいです。
        en: Given the present situation, we should postpone the release to next week.
        blank: present situation

  - id: progress-check
    ja: 進捗確認
    ja_reading: しんちょくかくにん
    en: progress check
    pos: noun
    lists: [2]
    examples:
      - ja: まずは、進捗確認をしましょう。
